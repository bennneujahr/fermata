name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Prüfungen (Tokens, Tonalität, Kontraste, Atem)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm checks

  database:
    name: Datenbank (Migrationen + pgTAP)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: psql installieren
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Migrationen und Tests
        run: bash scripts/db.sh test
      - name: Datenbank stoppen
        if: always()
        run: bash scripts/db.sh stop

  edge-functions:
    name: Edge Functions (Deno)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typprüfung
        working-directory: supabase/functions
        run: deno check $(find . -name '*.ts' -not -path '*/node_modules/*' | sort)

  matcher:
    name: Auswahl-Job (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: astral-sh/setup-uv@v6
      - name: psql installieren
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Test-Datenbank mit Migrationen
        run: bash scripts/db.sh migrate
      - name: ruff
        working-directory: services/matcher
        run: uv run ruff check .
      - name: pytest
        working-directory: services/matcher
        env:
          DB_PORT: "54322"
        run: uv run pytest -q
      - name: Datenbank stoppen
        if: always()
        run: bash scripts/db.sh stop
