[project]
name = "fermata-matcher"
version = "0.4.0"
description = "Fermata · Auswahl-Job (M4): Pool, harte Filter, Teil-Scores, LLM-Rubrik, Zuordnung, Lokal-Wahl, Prüf-Agent."
requires-python = ">=3.11"
dependencies = [
  "anthropic[bedrock]>=1.11,<2",
  "boto3>=1.40",
  "networkx>=3.4",
  "numpy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic>=2.8",
]

[project.optional-dependencies]
# PLAN 5.9: Ersatz-Bibliothek für die Zuordnung. „mwmatching“ (MIT, J. van Rantwijk) ist nicht auf PyPI;
# wer sie nutzen will, installiert sie manuell (siehe docs/bereiche/matcher.md). Der Job erkennt sie automatisch.

[project.scripts]
fermata-matcher = "fermata_matcher.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.7",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fermata_matcher"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "db: braucht die Test-Datenbank (DB_PORT, Standard 54362)",
  "slow: lange Läufe (z. B. Lasttest mit 5.000 Profilen); nur mit FERMATA_LOADTEST=1",
]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "E501"]  # Deutsche Texte (Gedankenstriche, Anführungszeichen); lange SQL-Texte.
