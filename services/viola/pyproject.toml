[project]
name = "fermata-viola"
version = "0.1.0"
description = "Viola: Gesprächs-Agent von Fermata (Stimme und Text), Hintergrund- und Sicherheits-Agent."
requires-python = ">=3.12,<3.13"
dependencies = [
  "anthropic[bedrock]>=1.11.0",
  "boto3>=1.43.0",
  "fastapi>=0.142.0",
  "uvicorn>=0.54.0",
  "httpx>=0.28.1",
  "pydantic>=2.13.0",
  "pyjwt>=2.15.0",
  "livekit-agents>=1.8.4",
  "livekit-api>=1.2.1",
  "livekit-plugins-deepgram>=1.8.4",
  "livekit-plugins-silero>=1.8.4",
]

[project.optional-dependencies]
google = ["google-cloud-texttospeech>=2.33.0"]

[project.scripts]
viola = "viola.cli:main"

[dependency-groups]
dev = [
  "pytest>=9.1.0",
  "pytest-asyncio>=1.4.0",
  "ruff>=0.16.0",
  "mypy>=2.4.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/viola"]

[tool.ruff]
line-length = 130
target-version = "py312"
src = ["src", "tests", "blindtest", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF", "PL", "S", "BLE", "FURB"]
ignore = [
  "RUF001", "RUF002", "RUF003",  # deutsche Typografie („“, –) ist gewollt
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR0917", "PLR2004",
  "S101",    # assert in Tests
  "S104",    # 0.0.0.0 im Container ist gewollt
  "S311",    # random nur für Blindtest-Reihenfolge, nicht für Sicherheit
  "PLC0415", # späte Importe für optionale Anbieter (LiveKit, Google)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "PLR", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["viola"]
mypy_path = "src"
warn_unused_ignores = false
disallow_any_generics = false

[[tool.mypy.overrides]]
module = ["livekit.*", "google.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["ignore::DeprecationWarning"]
