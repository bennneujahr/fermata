<!doctype html>
<html lang="de">
  <body style="margin:0;padding:24px;background:#F6F1E7;color:#1E1A2B;font-family:Georgia,'Times New Roman',serif;">
    <div style="max-width:520px;margin:0 auto;">
      <p style="font-size:18px;margin:0 0 16px;">Guten Tag,</p>
      <p style="font-size:16px;line-height:1.6;margin:0 0 16px;">Ihr Platz auf der Warteliste ist an der Reihe. Sie sind persönlich zu Fermata eingeladen.</p>
      <p style="font-size:16px;line-height:1.6;margin:0 0 16px;">Ihr Code zum Anlegen des Kontos:</p>
      <p style="font-size:32px;letter-spacing:6px;font-family:Menlo,Consolas,monospace;margin:0 0 24px;">{{ .Token }}</p>
      <p style="font-size:16px;line-height:1.6;margin:0 0 16px;"><a href="{{ .ConfirmationURL }}" style="color:#7A2638;">Konto anlegen</a></p>
      <p style="font-size:14px;line-height:1.6;color:#625B70;margin:24px 0 0;">Die Einladung ist persönlich und gilt 7 Tage.</p>
    </div>
  </body>
</html>
