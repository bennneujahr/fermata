# Fermata M1: Die Wartelisten-Functions werden ohne Supabase-JWT aufgerufen (Landingpage ohne Anmeldung,
# Bestätigungslink aus der Mail). Schutz: Prüfung, Drossel und Regeln in api.waitlist_* (PLAN 2.3 Nr. 1).
[functions.waitlist-signup]
verify_jwt = false

[functions.waitlist-confirm]
verify_jwt = false

[functions.waitlist-status]
verify_jwt = false

[functions.waitlist-unsubscribe]
verify_jwt = false

# Aufrufer ist die Server-Funktion /s/[slug] der Landingpage; optional mit LINK_HIT_SECRET geschützt.
[functions.link-hit]
verify_jwt = false

# Web-App (M2): Didit ruft den Webhook ohne Supabase-JWT auf; die Function prüft selbst die HMAC-Signatur.
[functions.verification-webhook]
verify_jwt = false

# M3 Viola: interner Aufruf durch den Sprach-Agenten mit eigenem Geheimnis (x-agent-secret).
[functions.interview-agent]
verify_jwt = false

# M5 Abende: Versand-Job (eigenes Geheimnis), Bestätigung durch das Lokal (signierter Link), öffentlicher VAPID-Schlüssel.
[functions.notify-dispatch]
verify_jwt = false

[functions.venue-confirm]
verify_jwt = false

[functions.push-key]
verify_jwt = false

# M6 Mitgliedschaft: Stripe ruft ohne JWT (Signaturprüfung in der Function); Kündigung und Widerruf
# funktionieren auch ohne Anmeldung (die Function prüft eine vorhandene Anmeldung selbst);
# billing-extend nur intern mit x-fermata-internal-secret.
[functions.stripe-webhook]
verify_jwt = false

[functions.billing-cancel]
verify_jwt = false

[functions.billing-withdraw]
verify_jwt = false

[functions.billing-extend]
verify_jwt = false

# M7 Sicherheit: öffentliche Seite für die Vertrauensperson; interner Mailversand mit eigenem Geheimnis.
[functions.trust-view]
verify_jwt = false

[functions.safety-dispatch]
verify_jwt = false
